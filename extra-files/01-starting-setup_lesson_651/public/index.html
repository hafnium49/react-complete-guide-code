<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      This is the SINGLE HTML file for the entire React application.
      React apps are "single page applications" (SPAs) — there is only
      ONE HTML page. All UI updates (showing modals, navigating between
      views, rendering lists, etc.) are handled by JavaScript editing
      the DOM on this single page. No additional HTML files are loaded.

      The <div> below with id="root" is the mount point for the React
      application. It starts out empty — React fills it at runtime.

      In index.js, the call to ReactDOM.createRoot(document.getElementById('root'))
      selects this div and tells React to render the application inside it.
      Everything that React produces (all the components, all the UI)
      ends up as child elements of this div.

      The div itself has no content in the HTML source. If you "View
      Page Source" in the browser, you'll see an empty div. The actual
      rendered content is created dynamically by React's JavaScript at
      runtime and is only visible via the browser's DevTools inspector.
    -->
    <div id="root"></div>
  </body>
</html>
